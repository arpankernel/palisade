[project]
name = "palisade-sec"
version = "0.6.1"
description = "Applied agentic-safety infrastructure: statically detects, evaluates, and gates untrusted-input-to-dangerous-capability paths in Python and JavaScript/TypeScript AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Palisade contributors" }]
keywords = ["security", "llm", "prompt-injection", "static-analysis", "taint", "agentic-safety", "ai-safety", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.urls]
# These become the "Project links" sidebar on the PyPI page, which is where
# someone arriving from `pip search`-shaped discovery actually clicks. 0.6.0
# published only Homepage and Issues, so the docs site and the changelog were
# unreachable from the package page.
Homepage = "https://arpankernel.github.io/palisade/"
Documentation = "https://arpankernel.github.io/palisade/docs/"
Source = "https://github.com/arpankernel/palisade"
Changelog = "https://github.com/arpankernel/palisade/blob/main/CHANGELOG.md"
Issues = "https://github.com/arpankernel/palisade/issues"

[project.scripts]
palisade-sec = "palisade_sec.cli:run"

[project.optional-dependencies]
js = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
# Judgment tier (`palisade-sec audit`/`review`). Bring-your-own-endpoint:
# needs an endpoint + key in .env and makes network calls. The offline core
# (scan/map/baseline/fix) never depends on this and stays offline/keyless.
judge = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
# `palisade-sec connect` stores credentials in the OS keychain when this is
# installed; without it, it falls back to a 0600 file. Nothing else needs it.
keyring = [
    "keyring>=25.0",
]
# Alias kept so `palisade-sec[semantic]` from earlier docs still resolves.
semantic = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palisade_sec"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution to actual source. The docs site carries
# node_modules (8,599 files, 85 MB) and the marketing site is not part of
# the package; hatchling does not honour their nested .gitignore files.
exclude = [
    "/docs-site",
    "/website",
    "/.github",
    "/dist",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/vulnerable-app", "tests/fixtures/hostile"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/palisade_sec"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
