name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check src tests scripts corpus
      - name: Types
        run: uv run mypy src/palisade_sec
      - name: Tests
        run: uv run pytest -q
      - name: Self-security - no code execution over the hostile corpus
        run: uv run pytest tests/test_self_security.py -q
      - name: Precision gate (Phase 0)
        run: uv run python scripts/precision.py corpus/manifest.yaml
      - name: Self-check - the example app must fail CI mode
        run: |
          if uv run palisade-sec scan examples/vulnerable-app --ci; then
            echo "expected non-zero exit on the vulnerable example app" && exit 1
          fi
      - name: Self-check - palisade's own source must be clean
        run: uv run palisade-sec scan src --ci

  install-surface:
    # The `test` job runs in a dev environment with every optional extra
    # installed, so it cannot see what `pip install palisade-sec` gets.
    # This job builds the wheel and drives every command from a fresh venv
    # with no extras. It exists because 0.5.0 shipped a `review` crash and
    # a zero-files `--ci` pass that only a plain install could reveal.
    name: Plain install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: uv build --wheel
      - name: Smoke-test the CLI as a user installs it
        run: PYTHON="$(uv python find 3.12)" scripts/smoke_install.sh dist/*.whl

  action-selftest:
    # Runs this repo's own action.yml (uses: ./) the way a user's workflow
    # would: a HIGH finding must fail the gate, the advisory mode must pass,
    # and the SARIF must carry the findings.
    name: GitHub Action (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          path: examples/support-bot
          sarif: "false"
          version: "0.5.1"
      - id: advisory
        uses: ./
        with:
          path: examples/support-bot
          sarif: "false"
          fail-on-findings: "false"
          version: "0.5.1"
      - name: Assert the gate failed and the advisory run reported
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_CODE: ${{ steps.gate.outputs.exit-code }}
          ADVISORY_CODE: ${{ steps.advisory.outputs.exit-code }}
          SARIF: ${{ steps.advisory.outputs.sarif-file }}
        run: |
          test "$GATE_OUTCOME" = "failure"
          test "$GATE_CODE" = "1"
          test "$ADVISORY_CODE" = "0"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=len(d['runs'][0]['results']); assert n == 3, n; print('SARIF results:', n)" "$SARIF"
