name: Benchmark corpus

# The Phase 0 precision gate against pinned third-party repos. This needs
# network and clones gigabytes, so it runs on a schedule and on demand -
# never on every push. The fast fixture corpus runs in ci.yml instead.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      triage:
        description: "Print the full trace for every false positive"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    # A full pass is ~25+ min of CPU across ~25k files (litellm alone is
    # 8,170), plus cloning gigabytes. Give it real headroom: a timeout here
    # reads as a precision failure when it is only a slow runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --dev

      - name: Fetch the pinned corpus
        run: uv run python corpus/fetch.py

      - name: Show what was pinned
        run: cat corpus/repos.lock.json

      - name: Score precision and recall
        run: |
          uv run python scripts/precision.py corpus/repos.yaml --repos \
            ${{ inputs.triage && '--triage' || '' }} | tee corpus-score.txt

      - name: Upload the score
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-score
          path: |
            corpus-score.txt
            corpus/repos.lock.json
          retention-days: 90
