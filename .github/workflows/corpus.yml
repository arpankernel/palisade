name: Benchmark corpus

# The Phase 0 precision gate against pinned third-party repos. This needs
# network and clones gigabytes, so it runs on a schedule and on demand -
# never on every push. The fast fixture corpus runs in ci.yml instead.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      triage:
        description: "Print the full trace for every false positive"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    # A full pass is ~25+ min of CPU across 40,466 files in 50 repos, plus
    # ~5.8 GB of shallow clones. Give it real headroom: a timeout here reads as
    # a precision failure when it is only a slow runner.
    #
    # This stays on a schedule and never on a pull request. The PR gate runs the
    # fast fixture manifest in ci.yml; moving it here would make every PR wait
    # minutes and would gate contributors on network access to 50 repositories.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --dev

      - name: Fetch the pinned corpus
        run: uv run python corpus/fetch.py

      - name: Show what was pinned
        run: cat corpus/repos.lock.json

      - name: Score precision and recall
        run: |
          uv run python scripts/precision.py corpus/repos.yaml --repos \
            ${{ inputs.triage && '--triage' || '' }} | tee corpus-score.txt

      - name: Upload the score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-score
          path: |
            corpus-score.txt
            corpus/repos.lock.json
          retention-days: 90
