# Dogfood: scan Palisade's own source and upload the results to the repo's
# Security tab as code-scanning alerts. Doubles as the reference workflow users
# copy (they scan `.` instead of `src`).
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  palisade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      # Self-scan is clean; a real project would scan `.` (and add [js] for JS/TS).
      - run: uv run palisade-sec scan src --sarif > palisade.sarif
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: palisade.sarif
          category: palisade-sec
