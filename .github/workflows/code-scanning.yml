# Dogfood: scan Palisade's own source and upload the results to the repo's
# Security tab as code-scanning alerts. Doubles as the reference workflow users
# copy (they scan `.` instead of `src`).
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  palisade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      # Self-scan is clean; a real project would scan `.` (and add [js] for JS/TS).
      - run: uv run palisade-sec scan src --sarif > palisade.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: palisade.sarif
          category: palisade-sec
