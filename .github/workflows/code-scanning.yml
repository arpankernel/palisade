# Dogfood: scan Palisade's own source and upload the results to the repo's
# Security tab as code-scanning alerts. Doubles as the reference workflow users
# copy (they scan `.` instead of `src`).
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  palisade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      # Self-scan is clean; a real project would scan `.` (and add [js] for JS/TS).
      - run: uv run palisade-sec scan src --sarif > palisade.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: palisade.sarif
          category: palisade-sec
