# Dogfood: scan Palisade's own source and upload the results to the repo's
# Security tab as code-scanning alerts. Doubles as the reference workflow users
# copy (they scan `.` instead of `src`).
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  palisade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      # Self-scan is clean; a real project would scan `.` (and add [js] for JS/TS).
      - run: uv run palisade-sec scan src --sarif > palisade.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: palisade.sarif
          category: palisade-sec
