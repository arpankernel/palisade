# Dogfood: scan Palisade's own source and upload the results to the repo's
# Security tab as code-scanning alerts. Doubles as the reference workflow users
# copy (they scan `.` instead of `src`).
name: code-scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  palisade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync
      # Self-scan is clean; a real project would scan `.` (and add [js] for JS/TS).
      - run: uv run palisade-sec scan src --sarif > palisade.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: palisade.sarif
          category: palisade-sec
