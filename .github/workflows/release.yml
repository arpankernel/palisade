name: Release

# Publishes to PyPI via Trusted Publishing (OIDC). There is no API token
# anywhere: GitHub mints a short-lived identity token for this exact
# workflow, in this exact repo, in this exact environment, and PyPI accepts
# it because that combination is registered as a trusted publisher.
#
# To cut a release:
#     git tag v0.4.0 && git push --tags
#
# The tag is the trigger and the source of truth for the version.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the build-provenance attestation (Sigstore)
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --dev

      # Never publish something that does not pass its own gates.
      - name: Gates
        run: |
          uv run ruff check .
          uv run ruff format --check src tests scripts corpus
          uv run mypy src/palisade_sec
          uv run pytest -q
          uv run python scripts/precision.py corpus/manifest.yaml

      - name: Tag must match the packaged version
        id: version
        run: |
          PKG=$(uv run python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match pyproject version $PKG"
              exit 1
            fi
            echo "tag v$TAG matches packaged version $PKG"
          fi

      - name: Build
        run: uv build

      # v0.3.3 shipped an 85 MB sdist because hatchling does not honour
      # nested .gitignore files and swept in docs-site/node_modules. Make
      # that specific mistake impossible to repeat silently.
      - name: Sdist must contain only source
        run: |
          SDIST=$(ls dist/*.tar.gz)
          SIZE=$(stat -c%s "$SDIST")
          echo "sdist: $SDIST ($((SIZE / 1024)) KB)"
          if [ "$SIZE" -gt 5000000 ]; then
            echo "::error::sdist is $((SIZE / 1048576)) MB - something unintended is bundled"
            exit 1
          fi
          if tar -tzf "$SDIST" | grep -qE "node_modules/|docs-site/|/dist/"; then
            echo "::error::sdist contains build or site artefacts:"
            tar -tzf "$SDIST" | grep -E "node_modules/|docs-site/|/dist/" | head
            exit 1
          fi
          echo "sdist is clean: $(tar -tzf "$SDIST" | wc -l) files"

      - name: Wheel must be installable and runnable
        run: |
          uv venv --seed /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/palisade-sec --version
          /tmp/smoke/bin/palisade-sec scan examples/vulnerable-app --json > /tmp/out.json
          /tmp/smoke/bin/python -c "import json; d=json.load(open('/tmp/out.json')); \
            assert d['summary']['high'] == 4, d['summary']; print('smoke scan OK')"

      # The same plain-install smoke test CI runs on every PR, repeated on
      # the exact artifact about to be published.
      - name: Every command works from a plain install (no extras)
        run: PYTHON="$(uv python find 3.12)" scripts/smoke_install.sh dist/*.whl

      # Supply-chain records, kept OUT of dist/ (everything in dist/ is
      # uploaded to PyPI). The SBOM lists the exact resolved runtime
      # dependencies; the attestation is a Sigstore-signed SLSA provenance
      # statement for each artifact, verifiable with
      # `gh attestation verify <file> --repo arpankernel/palisade`. PyPI
      # also stores its own PEP 740 attestations via Trusted Publishing.
      - name: Software bill of materials (CycloneDX)
        run: |
          mkdir -p sbom
          uv export --format cyclonedx1.5 --no-dev --all-extras --no-hashes \
            -o "sbom/palisade-sec-${{ steps.version.outputs.version }}.cdx.json"
          uv run python -c "import json,sys; d=json.load(open(sys.argv[1])); \
            assert d['bomFormat']=='CycloneDX', d; print(len(d.get('components', [])), 'components')" \
            sbom/*.cdx.json

      - name: Build provenance attestation
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/p/palisade-sec
    permissions:
      id-token: write # the OIDC token; this is what replaces the API token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # Phase 4 hardening will pin this to a commit SHA; release/v1 is the
      # form PyPI's own docs recommend today.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: sbom/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to PyPI: https://pypi.org/project/palisade-sec/${{ needs.build.outputs.version }}/

          See [CHANGELOG.md](https://github.com/arpankernel/palisade/blob/main/CHANGELOG.md) for what changed."
