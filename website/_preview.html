<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#2b2b2b}
  .lbl{font-family:monospace;color:#eee;text-align:center;padding:8px;font-size:13px}
  .stage{display:flex;justify-content:center}
  iframe{border:0;background:#fff;display:block}
</style></head>
<body>
  <div class="lbl" id="lbl"></div>
  <div class="stage"><iframe id="f" src="./index.html" scrolling="no"></iframe></div>
  <script>
    var w = parseInt(new URLSearchParams(location.search).get('w')) || 390;
    var f = document.getElementById('f');
    f.style.width = w + 'px';
    document.getElementById('lbl').textContent = 'viewport width: ' + w + 'px';
    function reveal(){
      try{
        var d = f.contentWindow.document;
        if(!d.getElementById('__force')){
          var s = d.createElement('style'); s.id='__force';
          s.textContent = '.reveal,.stagger>*,.hero-anim,.term-body .tline,.prec-col li{opacity:1!important;transform:none!important;animation:none!important}.term-cursor{display:none!important}';
          d.head.appendChild(s);
        }
      }catch(e){}
    }
    function fit(){ try{ var d=f.contentWindow.document; f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'; }catch(e){ f.style.height='7000px'; } }
    f.addEventListener('load', function(){ reveal(); fit(); setTimeout(function(){reveal();fit();},800); setTimeout(function(){reveal();fit();},2000); });
  </script>
</body></html>
