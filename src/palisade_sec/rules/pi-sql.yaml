id: PI-SQL
title: Prompt injection reaching raw SQL
severity: high
description: >
  Untrusted input flows into an LLM (typically text-to-SQL) whose output is
  executed as a raw, non-parameterized SQL statement. An attacker can steer
  the model into emitting destructive or exfiltrating SQL. This is the
  text-to-SQL design popularized by Vanna.ai, which runs model-written SQL
  verbatim.
sources:
  - kind: attribute
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.values"
      - "request.data"
      - "request.cookies"
      - "sys.argv"
      - "req.body"
      - "req.query"
      - "req.params"
      - "req.cookies"
      - "process.argv"
  - kind: call
    patterns:
      - "input"
      - "request.get_json"
  - kind: decorator
    patterns:
      - "*.route"
      - "*.api_route"
      - "*.get"
      - "*.post"
      - "*.put"
      - "*.patch"
      - "*.delete"
      - "*.websocket"
llm_signatures:
  - kind: call
    patterns:
      - "chat.completions.create"
      - "openai.ChatCompletion.create"
      - "openai.Completion.create"
      - "completions.create"
      - "messages.create"
      - "litellm.completion"
      - "litellm.acompletion"
      - "ollama.chat"
      - "ollama.generate"
      - "chain.run"
      - "chain.invoke"
      - "chain.predict"
      - "llm.predict"
      - "llm.invoke"
      - "llm.run"
      - "llm.complete"
      - "agent.run"
      - "agent.invoke"
      - "agent_executor.invoke"
      - "query_engine.query"
      - "model.generate_content"
sinks:
  - kind: call
    patterns:
      - "*.execute"
      - "*.executemany"
      - "*.executescript"
      - "*.raw"
      - "db.query"
      - "pool.query"
      - "conn.query"
      - "connection.query"
      - "client.query"
    safe_if_extra_args: true
    taint_args: [0]
sanitizers:
  # Trusted validation frameworks: a name match fully suppresses.
  - kind: call
    trusted: true
    patterns:
      - "model_validate"
      - "parse_obj"
      - "parse_raw"
      - "schema.load"
      - "sqlglot.parse"
  # Name heuristics: suppress only when the resolved function body
  # shows a real allowlist/validation shape; otherwise downgrade to MED
  # "unverified sanitizer" (Vanna's _sanitize_plotly_code, CVE-2024-5565).
  - kind: call
    patterns:
      - "allowlist"
      - "allow_list"
      - "allowed"
      - "whitelist"
      - "validate"
      - "sanitize"
      - "is_safe"
partial_defenses:
  - kind: call
    patterns:
      - "denylist"
      - "deny_list"
      - "blacklist"
      - "blocklist"
      - "blocked"
      - "banned"
      - "forbidden"
      - "readonly_check"
      - "confirm"
      - "approval"
      - "approve"
      - "auto_run"
      - "human_review"
# Standards mapping (see src/palisade_sec/standards.py). security_severity is
# GitHub code scanning's 0-10 score: >=9 critical, 7-8.9 high, 4-6.9 medium.
cwe: [CWE-89, CWE-1426, CWE-1427]
owasp_llm: ["LLM01:2025", "LLM05:2025"]
security_severity: 8.8
references:
  - "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
  - "https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/"
  - "https://owasp.org/www-community/attacks/SQL_Injection"
attack: >
  Crafted input steers the text-to-SQL model into emitting UNION-based
  exfiltration or destructive statements (DROP/DELETE), executed verbatim.
fix: >
  Execute model-generated SQL only through a read-only connection restricted to
  the intended schema, validate the statement type against an allowlist
  (e.g. SELECT-only via a SQL parser), and use parameterized queries for any
  user-supplied values.
