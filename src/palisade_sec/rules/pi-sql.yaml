id: PI-SQL
title: Prompt injection reaching raw SQL
severity: high
description: >
  Untrusted input flows into an LLM (typically text-to-SQL) whose output is
  executed as a raw, non-parameterized SQL statement. An attacker can steer
  the model into emitting destructive or exfiltrating SQL
  (Vanna.ai, CVE-2024-5565).
sources:
  - kind: attribute
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.values"
      - "request.data"
      - "request.cookies"
      - "sys.argv"
  - kind: call
    patterns:
      - "input"
      - "request.get_json"
llm_signatures:
  - kind: call
    patterns:
      - "chat.completions.create"
      - "openai.ChatCompletion.create"
      - "openai.Completion.create"
      - "completions.create"
      - "messages.create"
      - "litellm.completion"
      - "litellm.acompletion"
      - "ollama.chat"
      - "ollama.generate"
      - "chain.run"
      - "chain.invoke"
      - "chain.predict"
      - "llm.predict"
      - "llm.invoke"
      - "llm.run"
      - "llm.complete"
      - "agent.run"
      - "agent.invoke"
      - "agent_executor.invoke"
      - "query_engine.query"
      - "model.generate_content"
sinks:
  - kind: call
    patterns:
      - "*.execute"
      - "*.executemany"
      - "*.executescript"
      - "*.raw"
    safe_if_extra_args: true
sanitizers:
  - kind: call
    patterns:
      - "allowlist"
      - "allow_list"
      - "allowed"
      - "whitelist"
      - "validate"
      - "model_validate"
      - "parse_obj"
      - "parse_raw"
      - "schema.load"
      - "sanitize"
      - "is_safe"
      - "sqlglot.parse"
partial_defenses:
  - kind: call
    patterns:
      - "denylist"
      - "deny_list"
      - "blacklist"
      - "blocklist"
      - "blocked"
      - "banned"
      - "forbidden"
      - "readonly_check"
      - "confirm"
      - "approval"
      - "approve"
      - "auto_run"
      - "human_review"
references:
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - "CVE-2024-5565 (Vanna.ai)"
  - "CVE-2024-5826 (Vanna.ai)"
attack: >
  Crafted input steers the text-to-SQL model into emitting UNION-based
  exfiltration or destructive statements (DROP/DELETE), executed verbatim.
fix: >
  Execute model-generated SQL only through a read-only connection restricted to
  the intended schema, validate the statement type against an allowlist
  (e.g. SELECT-only via a SQL parser), and use parameterized queries for any
  user-supplied values.
