id: PI-HTTP
title: Prompt injection reaching an outbound HTTP request (SSRF / exfiltration)
severity: med
description: >
  Untrusted input flows into an LLM whose output is then used as the URL of
  an outbound HTTP request. An attacker can steer the model into requesting
  internal endpoints (SSRF: cloud metadata, admin APIs) or exfiltrating data
  to an attacker-controlled host. Advisory severity: agents that legitimately
  browse make this pattern intentional in some codebases — review, then
  either fix or baseline.
sources:
  - kind: attribute
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.values"
      - "request.data"
      - "request.cookies"
      - "sys.argv"
      - "req.body"
      - "req.query"
      - "req.params"
      - "req.cookies"
      - "process.argv"
  - kind: call
    patterns:
      - "input"
      - "request.get_json"
  - kind: decorator
    patterns:
      - "*.route"
      - "*.api_route"
      - "*.get"
      - "*.post"
      - "*.put"
      - "*.patch"
      - "*.delete"
      - "*.websocket"
llm_signatures:
  - kind: call
    patterns:
      - "chat.completions.create"
      - "openai.ChatCompletion.create"
      - "openai.Completion.create"
      - "completions.create"
      - "messages.create"
      - "litellm.completion"
      - "litellm.acompletion"
      - "ollama.chat"
      - "ollama.generate"
      - "chain.run"
      - "chain.invoke"
      - "chain.predict"
      - "llm.predict"
      - "llm.invoke"
      - "llm.run"
      - "llm.complete"
      - "agent.run"
      - "agent.invoke"
      - "agent_executor.invoke"
      - "query_engine.query"
      - "model.generate_content"
sinks:
  - kind: call
    patterns:
      - "requests.get"
      - "requests.post"
      - "requests.put"
      - "requests.delete"
      - "requests.head"
      - "requests.request"
      - "httpx.get"
      - "httpx.post"
      - "urllib.request.urlopen"
      - "urlopen"
    taint_args: [0]
sanitizers:
  - kind: call
    trusted: true
    patterns:
      - "model_validate"
      - "parse_obj"
      - "parse_raw"
      - "schema.load"
  - kind: call
    patterns:
      - "allowlist"
      - "allow_list"
      - "allowed"
      - "whitelist"
      - "validate"
      - "sanitize"
      - "is_safe"
partial_defenses:
  - kind: call
    patterns:
      - "denylist"
      - "deny_list"
      - "blacklist"
      - "blocklist"
      - "blocked"
      - "banned"
      - "forbidden"
      - "confirm"
      - "approval"
      - "approve"
      - "auto_run"
      - "human_review"
references:
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - "OWASP SSRF Prevention Cheat Sheet"
attack: >
  Crafted input makes the model emit a URL pointing at internal services
  (e.g. 169.254.169.254 cloud metadata) or an attacker-controlled host to
  exfiltrate context data via query parameters.
fix: >
  Never fetch model-chosen URLs directly. Resolve against an allowlist of
  hosts/schemes, block private and link-local address ranges after DNS
  resolution, and strip credentials and sensitive data from outbound URLs.
