id: PI-SHELL
title: Prompt injection reaching an OS command
severity: high
description: >
  Untrusted input flows into an LLM whose output is then passed to a shell
  (os.system, subprocess with shell=True, os.popen). An attacker can make the
  model emit a shell command string that runs on your host.
sources:
  - kind: attribute
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.values"
      - "request.data"
      - "request.cookies"
      - "sys.argv"
      - "req.body"
      - "req.query"
      - "req.params"
      - "req.cookies"
      - "process.argv"
  - kind: call
    patterns:
      - "input"
      - "request.get_json"
  - kind: decorator
    patterns:
      - "*.route"
      - "*.api_route"
      - "*.get"
      - "*.post"
      - "*.put"
      - "*.patch"
      - "*.delete"
      - "*.websocket"
llm_signatures:
  - kind: call
    patterns:
      - "chat.completions.create"
      - "openai.ChatCompletion.create"
      - "openai.Completion.create"
      - "completions.create"
      - "messages.create"
      - "litellm.completion"
      - "litellm.acompletion"
      - "ollama.chat"
      - "ollama.generate"
      - "chain.run"
      - "chain.invoke"
      - "chain.predict"
      - "llm.predict"
      - "llm.invoke"
      - "llm.run"
      - "llm.complete"
      - "agent.run"
      - "agent.invoke"
      - "agent_executor.invoke"
      - "query_engine.query"
      - "model.generate_content"
sinks:
  - kind: call
    patterns:
      - "os.system"
      - "os.popen"
      - "subprocess.getoutput"
      - "subprocess.getstatusoutput"
      - "child_process.exec"
      - "child_process.execSync"
    taint_args: [0]
  - kind: call
    patterns:
      - "subprocess.run"
      - "subprocess.call"
      - "subprocess.check_call"
      - "subprocess.check_output"
      - "subprocess.Popen"
    require_kwargs:
      shell: true
    taint_args: [0]
sanitizers:
  # Trusted validation frameworks: a name match fully suppresses.
  - kind: call
    trusted: true
    patterns:
      - "model_validate"
      - "parse_obj"
      - "parse_raw"
      - "schema.load"
      - "shlex.quote"
  # Name heuristics: suppress only when the resolved function body
  # shows a real allowlist/validation shape; otherwise downgrade to MED
  # "unverified sanitizer" (Vanna's _sanitize_plotly_code, CVE-2024-5565).
  - kind: call
    patterns:
      - "allowlist"
      - "allow_list"
      - "allowed"
      - "whitelist"
      - "validate"
      - "sanitize"
      - "is_safe"
partial_defenses:
  - kind: call
    patterns:
      - "denylist"
      - "deny_list"
      - "blacklist"
      - "blocklist"
      - "blocked"
      - "banned"
      - "forbidden"
      - "command_execution_functions"
      - "confirm"
      - "approval"
      - "approve"
      - "auto_run"
      - "human_review"
# Standards mapping (see src/palisade_sec/standards.py). security_severity is
# GitHub code scanning's 0-10 score: >=9 critical, 7-8.9 high, 4-6.9 medium.
cwe: [CWE-78, CWE-1426, CWE-1427]
owasp_llm: ["LLM01:2025", "LLM05:2025"]
security_severity: 9.3
references:
  - "https://genai.owasp.org/llmrisk/llm01-prompt-injection/"
  - "https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/"
  - "Open Interpreter: LLM -> shell by design, confirmation gate only"
attack: >
  Crafted input makes the model emit a shell command (e.g. "run `curl … | sh`"),
  which your code passes to a shell verbatim.
fix: >
  Never pass model output to a shell. Use subprocess.run([...]) with an
  argument list, no shell=True, and validate the executable and arguments
  against a strict allowlist.
