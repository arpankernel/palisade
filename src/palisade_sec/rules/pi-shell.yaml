id: PI-SHELL
title: Prompt injection reaching an OS command
severity: high
description: >
  Untrusted input flows into an LLM whose output is then passed to a shell
  (os.system, subprocess with shell=True, os.popen). An attacker can make the
  model emit a shell command string that runs on your host.
sources:
  - kind: attribute
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.values"
      - "request.data"
      - "request.cookies"
      - "sys.argv"
  - kind: call
    patterns:
      - "input"
      - "request.get_json"
llm_signatures:
  - kind: call
    patterns:
      - "chat.completions.create"
      - "openai.ChatCompletion.create"
      - "openai.Completion.create"
      - "completions.create"
      - "messages.create"
      - "litellm.completion"
      - "litellm.acompletion"
      - "ollama.chat"
      - "ollama.generate"
      - "chain.run"
      - "chain.invoke"
      - "chain.predict"
      - "llm.predict"
      - "llm.invoke"
      - "llm.run"
      - "llm.complete"
      - "agent.run"
      - "agent.invoke"
      - "agent_executor.invoke"
      - "query_engine.query"
      - "model.generate_content"
sinks:
  - kind: call
    patterns:
      - "os.system"
      - "os.popen"
      - "subprocess.getoutput"
      - "subprocess.getstatusoutput"
  - kind: call
    patterns:
      - "subprocess.run"
      - "subprocess.call"
      - "subprocess.check_call"
      - "subprocess.check_output"
      - "subprocess.Popen"
    require_kwargs:
      shell: true
sanitizers:
  - kind: call
    patterns:
      - "allowlist"
      - "allow_list"
      - "allowed"
      - "whitelist"
      - "validate"
      - "model_validate"
      - "parse_obj"
      - "parse_raw"
      - "schema.load"
      - "sanitize"
      - "is_safe"
      - "shlex.quote"
partial_defenses:
  - kind: call
    patterns:
      - "denylist"
      - "deny_list"
      - "blacklist"
      - "blocklist"
      - "blocked"
      - "banned"
      - "forbidden"
      - "command_execution_functions"
      - "confirm"
      - "approval"
      - "approve"
      - "auto_run"
      - "human_review"
references:
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - "Open Interpreter: LLM -> shell by design, confirmation gate only"
attack: >
  Crafted input makes the model emit a shell command (e.g. "run `curl … | sh`"),
  which your code passes to a shell verbatim.
fix: >
  Never pass model output to a shell. Use subprocess.run([...]) with an
  argument list, no shell=True, and validate the executable and arguments
  against a strict allowlist.
